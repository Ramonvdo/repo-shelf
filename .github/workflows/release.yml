name: release

# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux, then attaches them
# to a draft GitHub Release. Push a version tag to trigger:
#   git tag v0.1.0 && git push origin v0.1.0
# Review the draft, then publish it.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Do not also install libappindicator3-dev: it conflicts with the ayatana package.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'repo-shelf __VERSION__'
          releaseBody: |
            Download the installer for your platform below.

            - **Windows:** the `-setup.exe` (recommended) or the `.msi`
            - **macOS:** the `.dmg` for your chip (`aarch64` for Apple Silicon, `x64` for Intel)
            - **Linux:** the `.AppImage`, `.deb` or `.rpm`

            Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn on first launch. See the README for how to open it anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
